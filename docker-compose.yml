version: '3.8'

services:
  umami-db:
    image: postgres:15-alpine
    container_name: taa-umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-Q7mV2xL9pR4tN8cH3zD6kS1f}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: taa-umami
    ports:
      - "3100:3000"  # Umami dashboard accessible at localhost:3100
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-Q7mV2xL9pR4tN8cH3zD6kS1f}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-replace_this_with_random_string_min_32_chars}
      # Optional: disable telemetry
      DISABLE_TELEMETRY: ${UMAMI_DISABLE_TELEMETRY:-1}
      # Optional: enable debug mode
      # DEBUG: 1
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
  app:
    build: .
    command:
      [ "sh", "-c", "npx sequelize-cli db:migrate --config ./config/config.json --env local && npm start" ]

    env_file:
      - ./env/.env.local
    container_name: taa-esg-service
    ports:
      - "8082:8082"
    working_dir: /var/www
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - /var/www/node_modules
    depends_on:
      - postgres
    networks:
      - postgres


  postgres:
    container_name: postgres_container
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Q7mV2xL9pR4tN8cH3zD6kS1f}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
      - ./init-db-local.sql:/docker-entrypoint-initdb.d/init.sql  
    networks:
      - postgres
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - postgres
    restart: unless-stopped


networks:
  postgres:
    driver: bridge 

volumes:
  postgres:
  pgadmin:
  umami-db-data:
    driver: local